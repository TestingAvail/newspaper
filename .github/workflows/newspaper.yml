name: Personal RSS Newspaper

on:
  schedule:
    - cron: "0 6,18 * * *"  # Два раза в день: утром и вечером
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Newspaper
        run: |
          python3 - << 'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import os
          from datetime import datetime

          # Сюда пихай свои RSS/Atom ленты
          feeds = [
              {"name": "Hacker News", "url": "https://news.ycombinator.com/rss"},
              {"name": "Habr (Главная)", "url": "https://habr.com/ru/rss/all/"},
              {"name": "GitHub Changelog", "url": "https://github.blog/changelog/feed/"},
              {"name": "Cloudflare Blog", "url": "https://blog.cloudflare.com/rss/"},
              {"name": "Phoronix (Linux)", "url": "https://www.phoronix.com/rss.php"},
              {"name": "Krebs on Security", "url": "https://krebsonsecurity.com/feed/"},
              {"name": "Ars Technica", "url": "https://arstechnica.com/feed/"},
              {"name": "Linux Kernel Stable", "url": "https://www.kernel.org/feeds/kdist.xml"},
              {"name": "Arch Linux News", "url": "https://archlinux.org/feeds/news/"},
              {"name": "APNIC Blog", "url": "https://blog.apnic.net/feed/"},
              {"name": "Schneier on Security", "url": "https://www.schneier.com/blog/atom.xml"},
              {"name": "Troy Hunt", "url": "https://www.troyhunt.com/rss/"},
              {"name": "Dark Reading", "url": "https://www.darkreading.com/rss.xml"},
              {"name": "Ubuntu Security Notices", "url": "https://ubuntu.com/security/notices/rss.xml"},
              {"name": "Exploit-DB RSS", "url": "https://www.exploit-db.com/rss.xml"},
              {"name": "OpenNet (Программы)", "url": "https://www.opennet.ru/opennews/opennews_prog.rss"},
              {"name": "OpenNet (Безопасность)", "url": "https://www.opennet.ru/opennews/opennews_sec.rss"},
              {"name": "LOR", "url": "https://www.linux.org.ru/section-rss.jsp?section=1"},
              {"name": "FreeBSD Security", "url": "https://www.freebsd.org/security/feed.xml"},
              {"name": "LKML (Linux Kernel Mailing List)", "url": "https://lore.kernel.org/lkml/new.atom"}

          ]

          articles = []

          for feed in feeds:
              print(f"Fetching {feed['name']}...")
              try:
                  req = urllib.request.Request(feed['url'], headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      xml_data = response.read()
                      root = ET.fromstring(xml_data)

                      # Парсим RSS (item) или Atom (entry)
                      # Упрощенный парсер под стандартные RSS 2.0
                      for item in root.findall('.//item')[:5]:  # Берем топ-5 свежих из каждого
                          title = item.find('title')
                          link = item.find('link')
                          pubDate = item.find('pubDate')

                          t_text = title.text.strip() if title is not None else "No Title"
                          l_text = link.text.strip() if link is not None else "#"
                          d_text = pubDate.text.strip() if pubDate is not None else ""

                          articles.append({
                              "source": feed['name'],
                              "title": t_text,
                              "link": l_text,
                              "date": d_text
                          })
              except Exception as e:
                  print(f"Error fetching {feed['name']}: {e}")

          # Генерируем HTML-газету
          html_content = f"""<!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <title>Личный Дайджест Параноика</title>
              <style>
                  body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #121212; color: #e0e0e0; }}
                  h1 {{ border-bottom: 2px solid #333; padding-bottom: 10px; }}
                  .article {{ background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 4px solid #00acc1; }}
                  .source {{ font-size: 0.85em; color: #00acc1; text-transform: uppercase; font-weight: bold; }}
                  a {{ color: #80cbc4; text-decoration: none; }}
                  a:hover {{ text-decoration: underline; }}
                  .time {{ font-size: 0.8em; color: #757575; margin-top: 5px; }}
              </style>
          </head>
          <body>
              <h1>📰 Личный Дайджест</h1>
              <p>Сгенерировано автоматически: {datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S')} UTC</p>
              <div class="list">
          """

          for art in articles:
              html_content += f"""
                  <div class="article">
                      <div class="source">{art['source']}</div>
                      <h3><a href="{art['link']}" target="_blank">{art['title']}</a></h3>
                      <div class="time">{art['date']}</div>
                  </div>
              """

          html_content += """
              </div>
          </body>
          </html>
          """

          os.makedirs("public", exist_ok=True)
          with open("public/index.html", "w", encoding="utf-8") as f:
              f.write(html_content)
          print("Newspaper generated successfully.")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
