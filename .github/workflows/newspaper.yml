name: Personal RSS Newspaper

on:
  schedule:
    - cron: "0 6,18 * * *"  # Два раза в день: утром и вечером
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Newspaper
        run: |
          pip install -q feedparser
          python3 generate.py

      - name: Create Release and Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="digest-$(date -u +'%Y%m%d-%H%M')"
          FILE="public/index.html"
          
          MD5_VAL=$(md5sum "$FILE" | awk '{print $1}')
          SHA1_VAL=$(sha1sum "$FILE" | awk '{print $1}')
          SHA256_VAL=$(sha256sum "$FILE" | awk '{print $1}')
          SHA512_VAL=$(sha512sum "$FILE" | awk '{print $1}')
          
          cat << EOF > public/checksums.txt
          MD5:    $MD5_VAL
          SHA1:   $SHA1_VAL
          SHA256: $SHA256_VAL
          SHA512: $SHA512_VAL
          EOF

          # Пишем описание релиза во временный файл без ебли с экранированием
          cat << EOF > release_notes.md
          ### Контрольные суммы свежего выпуска:

          \`\`\`
          MD5:    $MD5_VAL
          SHA1:   $SHA1_VAL
          SHA256: $SHA256_VAL
          SHA512: $SHA512_VAL
          \`\`\`
          EOF

          gh release create "$TAG_NAME" \
            --title "Cybernews Digest [$TAG_NAME]" \
            --notes-file release_notes.md \
            "$FILE#index.html" \
            "public/checksums.txt#checksums.txt"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
